# CRUM tool permission classes. TECHNICAL_PLAN.md §4.6.2 and §12.2.
#
# Classes:
#   read-only  cannot mutate anything; no idempotency needed
#   auto       deterministic, idempotent, no human receipt needed
#   approval   acts only with a signed receipt bound to scope + action hash
#   refuse     never auto-runs; a human task is created instead
#
# This file is the source of truth for the tool registry AND the session
# permission map. Both are generated from it so the two cannot drift (§4.6.1).
version: 1

# A hyphen and a colon in a scope name mark two distinct permission
# boundaries, not one boundary spelled two ways. The punctuation is
# load-bearing in both scope families:
#   crm-write   (hyphen)  auto class: low-blast-radius write, no human receipt
#   crm:write   (colon)   approval class: staged write behind a signed receipt
#                         bound to scope + action hash
#   mail-write  (hyphen)  auto class: composes a draft, sends nothing
#   mail:send   (colon)   approval class: sends behind a signed receipt
# These are internal tool scopes, a different namespace from the MCP OAuth
# token scopes. The read pair announces itself by differing: the token scope
# is crm:read, the internal tool scope is crm-read. The write pair does not.
# crm:write is spelled identically in both namespaces and means a different
# thing in each: here it scopes three approval-class tools, while at
# TECHNICAL_PLAN.md:4287 it is one of two scopesSupported on the MCP token.
# It is the only such collision in this file. Do not normalise one spelling
# to the other: doing so silently moves tools across a gate boundary.
tools:
  # ── read-only (22) ─────────────────────────────────────────
  - name: crm.list_customers
    description: List customers visible to the caller.
    scope: crm-read
    class: read-only

  - name: crm.get_customer
    description: Read one customer with related counts.
    scope: crm-read
    class: read-only

  - name: crm.find_contacts
    description: Find contacts by customer, name or email.
    scope: crm-read
    class: read-only

  - name: crm.list_followups
    description: List followups filtered by status or date range.
    scope: crm-read
    class: read-only

  - name: crm.list_tasks
    description: List tasks filtered by assignee, priority or status.
    scope: crm-read
    class: read-only

  - name: crm.list_schedules
    description: List schedules by date range and attendee.
    scope: crm-read
    class: read-only

  - name: crm.my_open_items
    description: Today-view aggregation of open items for the caller.
    scope: crm-read
    class: read-only

  - name: crm.search
    description: Unified search across CRM objects.
    scope: crm-read
    class: read-only

  - name: knowledge.retrieve
    description: Reranked retrieval over the tenant knowledge index, citations returned.
    scope: knowledge-domains
    class: read-only

  - name: mail.search_threads
    description: Search the caller's connected Gmail mailbox. Snippets capped, bodies never returned.
    scope: mail-read
    class: read-only

  - name: doc.list_documents
    description: List structured business documents (invoices, contracts) for the tenant.
    scope: doc-read
    class: read-only

  - name: doc.get_invoice
    description: Read one invoice header and its line items by document id.
    scope: doc-read
    class: read-only

  - name: doc.get_contract
    description: Read one contract header and its key terms by document id.
    scope: doc-read
    class: read-only

  - name: doc.sum_invoices
    description: Aggregate ready invoice totals by vendor, customer and date range.
    scope: doc-read
    class: read-only

  - name: revenue.list_channels
    description: List tracked video channels (YouTube/TikTok/Instagram/Twitch) with ownership and sync status.
    scope: revenue-read
    class: read-only

  - name: revenue.sum_earnings
    description: Per-channel platform earnings rolled up over a date range; money as decimal text.
    scope: revenue-read
    class: read-only

  - name: revenue.revenue_totals
    description: Tenant-wide platform plus confirmed-sponsorship revenue totals over a date range.
    scope: revenue-read
    class: read-only

  - name: revenue.list_invoices
    description: List generated client billing invoices with their fee snapshot.
    scope: revenue-read
    class: read-only

  - name: revenue.list_alerts
    description: List revenue alerts (drops, spikes, new sponsorships, sync failures) for human review.
    scope: revenue-read
    class: read-only

  - name: crm.list_prospects
    description: List prospects visible to the caller.
    scope: crm-read
    class: read-only

  - name: crm.get_prospect
    description: Read one prospect with channels, latest evidence snapshot and drafts.
    scope: crm-read
    class: read-only

  - name: crm.list_merge_candidates
    description: List pending duplicate prospect pairs for human review.
    scope: crm-read
    class: read-only

  # ── auto (5) ───────────────────────────────────────────────
  - name: crm.log_followup
    description: Record a completed contact attempt.
    scope: crm-write
    class: auto
    idempotent: true
    idempotency_key: correlationId

  - name: crm.create_task
    description: Create a deadline-only task.
    scope: crm-write
    class: auto
    idempotent: true
    idempotency_key: correlationId

  - name: mail.draft
    description: Compose an email draft. Draft only, nothing is sent.
    scope: mail-write
    class: auto
    idempotent: true
    idempotency_key: draftHash

  - name: crm.draft_outreach
    description: Write a first or follow-up message for one prospect. Produces a draft, sends nothing.
    scope: crm-write
    class: auto
    idempotent: true
    idempotency_key: draftHash

  - name: crm.save_prospect_snapshot
    description: Record enrichment evidence for one prospect.
    scope: crm-write
    class: auto
    idempotent: true
    idempotency_key: correlationId

  # ── approval (9) ───────────────────────────────────────────
  - name: crm.create_customer
    description: Stage a new customer record.
    scope: crm:write
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.update_customer
    description: Stage a change to an existing customer.
    scope: crm:write
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.delete_customer
    description: Stage a soft delete. Risk floor 70.
    scope: crm:delete
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.create_contact
    description: Stage a new contact on an existing customer.
    scope: crm:write
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.create_schedule
    description: Stage a schedule. Notifies attendees on commit.
    scope: crm:schedule
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.transfer_owner
    description: Change record ownership; alters who can see the record.
    scope: crm:transfer
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: mail.send
    description: Send an approved email draft.
    scope: mail:send
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: crm.send_outreach
    description: Send an approved draft on a manual channel or by consented email.
    scope: crm:write
    class: approval
    idempotent: true
    idempotency_key: actionHash

  - name: crm.resolve_merge_candidate
    description: Dismiss a duplicate prospect pair, or stage a merge that folds the duplicate into the survivor.
    scope: crm:write
    class: approval
    idempotent: true
    idempotency_key: correlationId

  # ── workflow side effects (1) ──────────────────────────────
  - name: run.side-effect
    description: Any workflow side effect (scope template `{workflow}:{step}`).
    scope: "{workflow}:{step}"
    class: approval
    idempotent: true
    idempotency_key: actionHash

  # ── refuse (1) ─────────────────────────────────────────────
  - name: crm.bulk_import
    description: Multi-record import. Never auto-runs; always a human task.
    scope: crm:bulk
    class: refuse

connectors:
  - provider: smtp
    description: Sends approved mail behind the mail:send receipt.
    scope: mail:send
    class: approval

  - provider: calendar
    description: Writes approved schedules behind the crm:schedule receipt.
    scope: crm:schedule
    class: approval

  - provider: slack
    description: Approver notifications only. Never a workflow action.
    scope: approver-notify
    class: approval
